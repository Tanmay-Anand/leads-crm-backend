spring:
  application:
    name: leads-crm-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    hibernate:
      # The reference service runs `validate` against a Flyway-managed schema. This one has no
      # migrations, so Hibernate owns the schema. See README.md § Deviations.
      ddl-auto: ${APP_DDL_AUTO:update}
    properties:
      hibernate:
        default_schema: crm
        format_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 50

  datasource:
    url: jdbc:postgresql://localhost:${APP_DB_PORT:5433}/leads-crm?stringtype=unspecified&ApplicationName=leads-crm&currentSchema=crm
    username: ${APP_DB_USERNAME:postgres}
    password: ${APP_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /leads-crm

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

aws:
  region: ${AWS_REGION:ap-south-1}
  cognito:
    userPoolId: ${AWS_COGNITO_USER_POOL_ID:}
    clientId: ${AWS_COGNITO_CLIENT_ID:}

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174

logging:
  level:
    com.leadrat.crm.leads: DEBUG
