spring:
  application:
    name: leads-crm-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    hibernate:
      # The reference service runs `validate` against a Flyway-managed schema. This one has no
      # migrations, so Hibernate owns the schema. See README.md § Deviations.
      ddl-auto: ${APP_DDL_AUTO:update}
    properties:
      hibernate:
        default_schema: crm
        format_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 50

  datasource:
    url: jdbc:postgresql://localhost:${APP_DB_PORT:5433}/leads-crm?stringtype=unspecified&ApplicationName=leads-crm&currentSchema=crm
    username: ${APP_DB_USERNAME:postgres}
    password: ${APP_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /leads-crm

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

ai-sdk:
  enabled: true
  security:
    jwt-secret: ${AI_SDK_JWT_SECRET}
    jwt-expiry-minutes: 60
    allowed-origins:
      - ${AI_SDK_ALLOWED_ORIGIN:http://localhost:5173}
  storage:
    sqlite-path: ${AI_SDK_SQLITE_PATH:./ai-sdk-data/sdk-config.db}
  llm:
    api-key: ${OPENROUTER_API_KEY}
    planner-model: ${AI_SDK_LLM_PLANNER_MODEL:anthropic/claude-sonnet-4.5}
    summarizer-model: ${AI_SDK_LLM_SUMMARIZER_MODEL:anthropic/claude-sonnet-4.5}
  license:
    key: ${AI_SDK_LICENSE_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

aws:
  region: ${AWS_REGION:ap-south-1}
  cognito:
    userPoolId: ${AWS_COGNITO_USER_POOL_ID:}
    clientId: ${AWS_COGNITO_CLIENT_ID:}

app:
  cors:
    # Deliberately blank. The real default is DEFAULT_ALLOWED_ORIGIN_PATTERNS in
    # WebSecurityConfig, which applies whenever this resolves to nothing — including when
    # APP_CORS_ORIGINS is set but empty, which a YAML default here could not catch. Set this to a
    # comma-separated list of origins or wildcard patterns to override it entirely.
    allowed-origins: ${APP_CORS_ORIGINS:}

logging:
  level:
    com.leadrat.crm.leads: DEBUG
