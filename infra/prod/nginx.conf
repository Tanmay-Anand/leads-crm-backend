# Reverse proxy in front of the API.
#
# TLS is terminated upstream by CloudFront, so this listens on plain HTTP and trusts the
# forwarded headers CloudFront sets. The security group is what keeps port 80 reachable only
# from CloudFront.

upstream api {
    server api:8090;
}

server {
    listen 80;
    server_name _;

    # Health check for the load balancer, answered without touching the app.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # CloudFront sets this to the scheme the browser used, which is what Spring needs to
        # build correct absolute URLs behind TLS termination.
        proxy_set_header X-Forwarded-Proto $http_cloudfront_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # Spring Boot startup can outlast the default 60s on a small instance.
        proxy_connect_timeout 75s;
        proxy_read_timeout    120s;

        # The API is JSON only; no buffering benefit, and it delays error responses.
        proxy_buffering off;
    }
}
