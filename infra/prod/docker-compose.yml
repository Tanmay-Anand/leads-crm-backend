# Production stack for the single EC2 host.
#
# Mirrors platform-api's infra/<env>/docker-compose.yml, minus the database: Postgres is RDS now,
# so this host runs only the app and nginx. Values come from infra/prod/.env, which is never
# committed, and the database password is not in it — see below.
#
#   ./start.sh
#
# The deploy workflow runs exactly that over SSM.

services:
  api:
    image: ${API_IMAGE}
    container_name: leads-crm-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_DB_HOST: ${APP_DB_HOST}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USERNAME: ${APP_DB_USERNAME}
      # Injected by start.sh, which reads it from Secrets Manager using the instance role. It is
      # deliberately absent from .env so the password never sits on the filesystem.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID}
      AWS_COGNITO_CLIENT_ID: ${AWS_COGNITO_CLIENT_ID}
      # Unused when the frontend reaches the API through the Amplify proxy, since those requests
      # are same-origin. Kept so switching to a direct CloudFront origin needs no file changes.
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-}
      # ai-sdk. This block is not optional: AI_SDK_JWT_SECRET and OPENROUTER_API_KEY are the only
      # two placeholders in application.yaml with no default, so the container exits on boot
      # without them and nginx answers 502 with no upstream. `environment:` here is an allowlist,
      # so putting them in .env alone does nothing — they have to be named here as well.
      AI_SDK_JWT_SECRET: ${AI_SDK_JWT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      AI_SDK_ALLOWED_ORIGIN: ${AI_SDK_ALLOWED_ORIGIN:-}
      AI_SDK_SQLITE_PATH: /data/ai-sdk/sdk-config.db
      # The model names and the licence key are deliberately NOT forwarded. They are defaulted in
      # application.yaml, and an absent key here would arrive as an empty string, which Spring
      # treats as a set value and so silently overrides the default with "". Add one back only
      # alongside a real value in .env.
    volumes:
      # The ai-sdk admin password, set once through the /ai-sdk/setup OTP exchange, lives in this
      # SQLite file. Inside the container it would be destroyed by every deploy, which silently
      # re-runs first-boot setup and invalidates the password the LeadLens adapter holds.
      - ai-sdk-data:/data/ai-sdk
    # Only nginx should reach the app.
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/leads-crm/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      # Spring Boot on a t3.small, now also opening a TLS connection to RDS.
      start_period: 60s
    logging:
      # Without this the JSON log file grows until it fills the 20GB volume.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: leads-crm-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ai-sdk-data:
